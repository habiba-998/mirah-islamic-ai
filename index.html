    <div style="display:flex;gap:8px;flex-wrap:wrap"><span class="pill t-lapis">${T('Recommended · highest impact','موصى به · الأعلى أثرًا')}</span><span class="pill t-neutral">${T('Addresses 211 questions','يعالج ٢١١ سؤالًا')}</span></div>
    <h2>${esc(L(o.title))}</h2>
    <p class="alt-title" dir="auto">${esc(other(o.title))}</p>
    <p class="why">${T('The demo data shows a recurring overlap between these concepts. The system suggests short content that explains the differences between them, based on trusted sources.','تشير البيانات التجريبية إلى تداخل متكرر بين هذه المفاهيم. يقترح النظام محتوى قصيرًا يوضح الفروق بينها مع الاستناد إلى مصادر موثوقة.')}</p>
    <div class="ai-note">${I.shield}<span>${T('This is an automated suggestion. No content is published without human review.','هذا اقتراح آلي ولا يُنشر أي محتوى دون مراجعة بشرية.')}</span></div>
    <div class="opp-cta"><button class="btn btn-primary" data-act="brief" data-k="main">${I.doc} ${T('Create content brief','إنشاء موجز للمحتوى')}</button><span class="muted" style="font-size:13px">${T('Drafted from BAYYIN evidence.','يُعدّ من أدلة بَيِّن.')}</span></div>
  </div>
  <div class="opp-attrs">
    <div class="attr"><span>${T('Content type','نوع المحتوى')}</span><b>${esc(L(o.format))}</b></div>
    <div class="attr"><span>${T('Audience','الجمهور')}</span><b>${esc(L(o.audience))}</b></div>
    <div class="attr"><span>${T('Supporting concepts','المفاهيم الداعمة')}</span><b class="num">${N(3)}</b></div>
    <div class="attr"><span>${T('Trusted sources','المصادر الموثوقة')}</span><b class="num">${N(8)}</b></div>
    <div class="attr"><span>${T('Languages','اللغات')}</span><b>${T('Arabic • English','العربية • الإنجليزية')}</b></div>
    <div class="attr"><span>${T('Potential reach','الوصول المحتمل')}</span><b>${T('High','مرتفع')} <span class="reach" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i></span></b></div>
  </div>
</div>
<section class="sec">
  <div class="sec-head"><h2 class="h2">${T('More opportunities','فرص أخرى')}</h2><p>${T('Ranked by the number of questions addressed.','مرتبة بحسب عدد الأسئلة التي تعالجها.')}</p></div>
  <div class="opp-small">${['sword','inherit','sharia'].map(k=>{ const x=OPPS[k]; return `<button class="card os" data-act="brief" data-k="${k}"><span class="eyebrow">${esc(L(x.cluster))} · ${qn(x.addresses)}</span><span class="ot">${esc(L(x.title))}</span><span class="om"><span class="chip">${esc(L(x.kind))}</span><span class="chip">${esc(L(x.tag))}</span></span><span class="open">${T('Open brief','افتح الموجز')} ${I.arrow}</span></button>`; }).join('')}</div>
</section>`;
};
function briefHTML(){
  const o=OPPS[state.briefKey]||OPPS.main;
  const close=`<button class="icon-btn" data-act="closeOverlays" aria-label="${T('Close','إغلاق')}">${I.close}</button>`;
  if(state.brief==='loading') return `<div class="sheet-head"><div class="eyebrow">${T('Content brief','موجز المحتوى')}</div>${close}</div>
    <div class="sheet-body"><div style="display:flex;gap:14px;align-items:center"><span class="spinner"></span><div><b style="font-weight:600">${T('Drafting the brief from trusted sources','جارٍ إعداد الموجز من المصادر الموثوقة')}</b><div class="muted" style="font-size:13px">${T('Pulling key concepts from the cluster and BAYYIN evidence…','استخلاص المفاهيم الأساسية من المجموعة وأدلة بَيِّن…')}</div></div></div>
    <div class="skel" style="margin-top:26px"><i style="width:70%;height:22px"></i><i style="width:40%"></i><i style="width:100%;margin-top:14px"></i><i style="width:92%"></i><i style="width:84%"></i><i style="width:60%;margin-top:14px"></i><i style="width:96%"></i></div></div>`;
  const cs=CASE_STATUS[caseById('BYN-0142').status];
  return `<div class="sheet-head"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="eyebrow">${T('Content brief','موجز محتوى')} · ${code(o.id)}</span><span class="pill t-neutral">${T('Draft','مسودة')}</span>${(state.briefKey==='main'||state.briefKey==='sword')?`<span class="pill ${cs.tone}"><span class="dot"></span>${T('Evidence','الأدلة')}: ${esc(L(cs.label))}</span>`:''}</div>${close}</div>
  <div class="sheet-body brief" id="briefText">
    <div class="draft-banner">${I.alert}<span>${T('Draft only — requires human review before publishing.','مسودة فقط — تتطلب مراجعة بشرية قبل النشر.')}</span></div>
    <h4>${T('Title','العنوان')}</h4>
    <h2>${esc(L(o.title))}</h2>
    <p class="alt-title" dir="auto">${esc(other(o.title))}</p>
    <div class="facts"><div><span>${T('Format','الصيغة')}</span><b>${esc(L(o.format))}</b></div><div><span>${T('Audience','الجمهور')}</span><b>${esc(L(o.audience))}</b></div><div><span>${T('Languages','اللغات')}</span><b>${T('Arabic · English','العربية · الإنجليزية')}</b></div><div><span>${T('Addresses','يعالج')}</span><b>${qn(o.addresses)}</b></div></div>
    <h4>${T('Objective','الهدف')}</h4><p>${esc(L(o.objective))}</p>
    <h4>${T('Audience','الجمهور')}</h4><p>${esc(L(o.audience))}${T(' — people who asked these questions, plus educators and community leaders who receive them.',' — من طرحوا هذه الأسئلة، إضافة إلى المعلمين وقادة المجتمع الذين تصلهم.')}</p>
    <h4>${T('Key concepts','المفاهيم الأساسية')}</h4><ol>${o.concepts.map(x=>`<li>${esc(L(x))}</li>`).join('')}</ol>
    <h4>${T('Suggested sources','المصادر المقترحة')}</h4><ul class="src-list">${o.sources.map(s=>`<li><span class="badge">${s[0]}</span><span>${esc(L(s[1]))} ${s[2]?demoTag():''}</span></li>`).join('')}</ul>
    <h4>${T('Content structure','هيكل المحتوى')}</h4><div class="beats">${o.outline.map(b=>`<div class="beat"><span class="ts">${N(b[0])}</span><div><b>${esc(L(b[1]))}</b><p>${esc(L(b[2]))}</p></div></div>`).join('')}</div>
    <h4>${T('Review notes','ملاحظات المراجعة')}</h4><p>${esc(L(o.review))}</p>
  </div>
  <div class="sheet-foot"><button class="btn btn-ghost btn-sm" data-act="copyBrief">${I.copy} ${T('Copy brief','نسخ الموجز')}</button><button class="btn btn-ghost btn-sm" data-go="landscape">${T('Back to Knowledge Landscape','العودة إلى خريطة المعرفة')}</button><button class="btn btn-primary btn-sm" data-act="sendBrief">${T('Send for review','أرسل للمراجعة')}</button></div>`;
}
function openBrief(k){
  state.briefKey=k||'main'; state.brief='loading';
  const m=$('#modal'); $('#sheet').setAttribute('aria-label',T('Content brief','موجز المحتوى')); $('#sheet').innerHTML=briefHTML(); m.classList.add('on'); m.setAttribute('aria-hidden','false'); $('#scrim').classList.add('on');
  renderStory();
  later(()=>{ if(state.brief!=='loading') return; state.brief='open'; $('#sheet').innerHTML=briefHTML(); renderStory(); },1500);
}

/* ================= actions ================= */
function setLang(l){
  if(l===LANG) return; syncClaimFromInput(); LANG=l;
  const h=document.documentElement; h.lang=l; h.dir=l==='ar'?'rtl':'ltr';
  render(true);
}
const ACT={
  back,
  lang(t){ setLang(t.dataset.l); },
  reset(){ state.stack=[]; Object.assign(state,{claimObj:FEAT,claimCustom:'',claimOrigin:'jihad',mode:'text',attached:false,analysis:'featured',selected:null,challenge:'none',clusterSel:{},caseId:'BYN-0142',brief:'closed',openAcc:{}});
    for(let i=CASES.length-1;i>=0;i--){ const o=ORIG[CASES[i].id]; if(!o) CASES.splice(i,1); else { CASES[i].status=o.status; CASES[i].log=CASES[i].log.slice(0,o.log); } }
    state.route='__'; go('home'); state.stack=[]; toast(T('Demo restarted','أُعيد تشغيل العرض')); },
  analyzeFromHome(){ state.claimOrigin=null; state.claimObj=FEAT; state.mode='text'; go('bayyin'); },
  period(t){ state.period=t.dataset.p; $$('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.p===state.period)); toast(T('Showing: ','العرض: ')+t.textContent+T(' · simulated figures',' · أرقام محاكاة')); },
  clusterNode(t){ selectClusterNode(t.dataset.node); },
  investigate(t){ const c=CLUSTERS[t.dataset.k]; state.claimObj=c.claim; state.claimOrigin=c.key; state.mode='text'; state.attached=false; go('bayyin'); },
  mode(t){ syncClaimFromInput(); state.mode=t.dataset.m; $('#composer').innerHTML=composerHTML(); },
  attach(){ state.attached=true; $('#composer').innerHTML=composerHTML(); toast(T('Screenshot added · text extracted','أُضيفت اللقطة · استُخرج النص')); },
  clearShot(){ state.attached=false; $('#composer').innerHTML=composerHTML(); },
  example(t){ const ex=t.dataset.ex; state.claimObj=ex==='feat'?FEAT:ex==='sword'?EXSWORD:EX2030; state.mode='text'; state.claimOrigin=ex==='2030'?null:'jihad';
    if(state.route!=='bayyin'){ go('bayyin'); if(t.dataset.run) later(runAnalysis,450); return; }
    $('#composer').innerHTML=composerHTML(); const ta=$('#claimInput'); if(ta) ta.focus(); },
  analyze: runAnalysis,
  node(t){ const id=t.dataset.id; if(id) openDrawer(id); },
  closeOverlays(){ closeOverlays(false); },
  showOnMap(t){ const id=t.dataset.id; closeOverlays(false); state.selected=id; applyHighlight(); scrollToEl('#mapSec'); },
  challengeFromDrawer(){ closeOverlays(false); runChallenge(); },
  flag(t){ toast(T('Flagged '+byId[t.dataset.id].code+' for specialist attention','أُحيل الدليل '+byId[t.dataset.id].code+' إلى عناية المختص')); },
  acc(t){ const id=t.dataset.id; state.openAcc[id]=!state.openAcc[id]; t.closest('.acc-item').classList.toggle('open',!!state.openAcc[id]); t.setAttribute('aria-expanded',state.openAcc[id]?'true':'false'); },
  challenge: runChallenge,
  toReview(t){ state.caseId=t.dataset.id; go('review'); },
  newCase(){
    const txt=claimText(); let c=CASES.find(x=>x.claim.en===txt||x.claim.ar===txt);
    if(!c){ const obj=state.claimObj||B(txt,txt);
      c={id:'BYN-0'+(143+CASES.length-4), claim:obj, status:'needs', topic:B('Unclustered','غير مصنفة'), opened:B('Today, now','اليوم، الآن'), origin:B('BAYYIN · stopped for insufficient evidence','بَيِّن · توقف لعدم كفاية الأدلة'), assignee:B('Unassigned','لم يُعيَّن بعد'), sla:B('48 hours','٤٨ ساعة'),
        sources:[], evidence:[], reasons:[B('No passage in the demo source base met the confidence threshold.','لم يتجاوز أي نص في قاعدة المصادر التجريبية حد الثقة.'),B('The claim attributes a statement to a religious source that could not be verified.','ينسب الادعاء قولًا إلى مصدر ديني لم يمكن التحقق منه.')],
        rule:B('Automatic conclusion stopped: no sufficient reference was found.','أُوقف الاستنتاج التلقائي لعدم وجود مرجع كافٍ.'), draft:B('No conclusion drafted. BAYYIN stopped before drafting because no trusted evidence was found.','لم تُعدّ أي مسودة؛ توقف بَيِّن قبل الصياغة لعدم وجود أدلة موثوقة.'), note:B('',''),
        log:[['--:--',B('BAYYIN analysis stopped · insufficient evidence','توقف تحليل بَيِّن · أدلة غير كافية')],['--:--',B('Case opened for specialist review','فُتحت الحالة لمراجعة مختص')]]};
      CASES.unshift(c); }
    state.caseId=c.id; go('review'); toast(T('Case '+c.id+' opened for specialist review','فُتحت الحالة '+c.id+' لمراجعة مختص'));
  },
  openCase(t){ state.caseId=t.dataset.id; go('review'); },
  selectCase(t){ state.caseId=t.dataset.id; $('#case').innerHTML=caseHTML(caseById(state.caseId)); $('#queue').innerHTML=queueHTML(); if(window.innerWidth<980) scrollToEl('#case'); },
  review(t){ reviewAction(t.dataset.kind); },
  brief(t){ openBrief(t.dataset.k); },
  copyBrief(){ const el=$('#briefText'), text=el?el.innerText:''; const fb=()=>{ selectText(el); toast(T('Text selected. Press Ctrl+C to copy.','حُدد النص. اضغط Ctrl+C للنسخ.')); }; try{ navigator.clipboard.writeText(text).then(()=>toast(T('Brief copied','نُسخ الموجز')),fb); }catch(e){ fb(); } },
  sendBrief(){ toast(T('Brief sent for specialist review (simulated)','أُرسل الموجز لمراجعة المختص (محاكاة)')); },
  storyPrev(){ back(); }, storyNext(){ storyNext(); }, storyGo(t){ storyGo(+t.dataset.step); }
};
function selectText(el){ if(!el) return; const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
function ensureFeatured(){ if(state.analysis!=='featured'||!isFeatured(claimText())){ state.claimObj=FEAT; state.claimOrigin='jihad'; state.analysis='featured'; } }
function storyGo(i){
  switch(i){
    case 0: go('landscape'); break;
    case 1: go('bayyin'); break;
    case 2: ensureFeatured(); if(state.route==='analysis') scrollToEl('#mapSec'); else { state.pendingScroll='#mapSec'; go('analysis'); } state.focusEvidence=true; renderStory(); break;
    case 3: ensureFeatured(); state.focusEvidence=false; if(state.challenge==='none'){ if(state.route!=='analysis') go('analysis'); runChallenge(); } else if(state.route==='analysis') scrollToEl('#chalOpen'); else { state.pendingScroll='#chalOpen'; go('analysis'); } break;
    case 4: go('review'); break;
    case 5: go('content'); break;
  }
}
function storyNext(){
  switch(state.route){
    case 'home': go('landscape'); break;
    case 'landscape': go('cluster','jihad'); break;
    case 'cluster': { const c=CLUSTERS[state.param]; state.claimObj=c.claim; state.claimOrigin=c.key; state.mode='text'; go('bayyin'); break; }
    case 'bayyin': runAnalysis(); break;
    case 'analysis': if(state.analysis!=='featured'){ ACT.newCase(); break; } if(state.focusEvidence&&state.challenge==='open'){ state.focusEvidence=false; renderStory(); scrollToEl('#chalOpen'); break; } if(state.challenge==='none') runChallenge(); else if(state.challenge==='open'){ state.caseId='BYN-0142'; go('review'); } break;
    case 'review': go('content'); break;
    case 'content': if(state.brief==='closed') openBrief('main'); break;
  }
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-act]'); if(!t) return;
  if(t.dataset.go){ e.preventDefault(); const p=t.dataset.go.split(':'); go(p[0],p[1]); return; }
  const fn=ACT[t.dataset.act]; if(fn){ e.preventDefault(); fn(t,e); }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ closeOverlays(false); return; }
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='textarea'||tag==='input'||e.metaKey||e.ctrlKey||e.altKey) return;
  if($('#drawer').classList.contains('on')||$('#modal').classList.contains('on')) return;
  const rtl=LANG==='ar';
  if(e.key==='PageDown'||(e.key==='ArrowRight'&&!rtl)||(e.key==='ArrowLeft'&&rtl)){ e.preventDefault(); storyNext(); }
  else if(e.key==='PageUp'||(e.key==='ArrowLeft'&&!rtl)||(e.key==='ArrowRight'&&rtl)){ e.preventDefault(); back(); }
});
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeOverlays(false); });

/* ================= boot ================= */
(function boot(){
  let h=''; try{ h=(location.hash||'').replace('#',''); }catch(e){}
  if(h.startsWith('cluster-')&&CLUSTERS[h.slice(8)]){ state.route='cluster'; state.param=h.slice(8); }
  else if(SCREENS[h]) state.route=h;
  document.documentElement.lang=LANG; document.documentElement.dir='rtl';
  render();
})();
})();
</script>
</body>
</html>
