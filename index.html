<style>
:root{
  color-scheme:dark;
  --bg:#0C0F14; --surface:#12161E; --surface-2:#161B24; --sunken:#0F1319; --raised:#1B212C;
  --ink:#E9EBEF; --ink-2:#BCC3CE; --muted:#8B94A4; --faint:#5C6575;
  --line:#232A34; --line-2:#323A46;
  --lapis:#93A9F2; --lapis-2:#AFC0F6; --lapis-soft:#18203A; --lapis-line:#34437A; --lapis-deep:#111831;
  --brass:#CFAE70; --brass-soft:#261F15;
  --ok:#62C29A; --ok-soft:#12251D;
  --yellow:#DCC35E; --yellow-soft:#26230F;
  --orange:#E8904F; --orange-soft:#2A1B11;
  --risk:#E58383; --risk-soft:#2C1819;
  --warn:#E3A94F; --warn-soft:#29200F;
  --on-ink:#0C0F14; --on-accent:#0B1020;
  --backdrop:rgba(3,5,9,.62);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -18px rgba(0,0,0,.7);
  --shadow-lg:0 30px 70px -24px rgba(0,0,0,.85);
  --serif:'Newsreader','Markazi Text','Iowan Old Style',Georgia,serif;
  --sans:'IBM Plex Sans','IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --naskh:'Amiri','Markazi Text','Traditional Arabic','Times New Roman',serif;
  --mono:'IBM Plex Mono','IBM Plex Sans Arabic',ui-monospace,Consolas,monospace;
  --r:10px; --r-lg:16px;
  --top:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
html[lang="ar"] body{font-size:15.5px;line-height:1.75}
html[lang="ar"] body *{letter-spacing:0 !important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
textarea,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lapis);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
html[dir="rtl"] .flip{transform:scaleX(-1)}
bdi.code{font-family:var(--mono);font-size:.92em;direction:ltr;unicode-bidi:isolate}

/* ---------- chrome ---------- */
.topbar{position:sticky;top:var(--top);z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.3) blur(14px);-webkit-backdrop-filter:saturate(1.3) blur(14px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1320px;margin:0 auto;padding-inline:24px;height:62px;display:flex;align-items:center;gap:26px}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand svg{width:22px;height:22px;color:var(--brass)}
.brand .w-en{font-family:var(--serif);font-weight:500;letter-spacing:.01em;font-size:20px}
.brand .w-ar{font-family:var(--naskh);font-size:23px;line-height:1}
.brand .w-2{color:var(--muted)}
.brand .w-2.w-en{font-size:15px}
.brand .w-2.w-ar{font-size:18px}
.brand .w-sep{width:1px;height:18px;background:var(--line-2)}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav button{position:relative;padding:8px 12px;border-radius:8px;font-size:14px;color:var(--ink-2);white-space:nowrap;display:flex;align-items:center;gap:7px;transition:background .15s,color .15s}
.nav button:hover{background:var(--raised);color:var(--ink)}
.nav button.active{color:var(--ink);font-weight:500}
.nav button.active::after{content:"";position:absolute;inset-inline:12px;bottom:-12px;height:2px;background:var(--lapis);border-radius:2px}
.nav .nav-b svg{width:14px;height:14px;color:var(--lapis)}
.nav .count{font-family:var(--mono);font-size:10.5px;background:var(--warn-soft);color:var(--warn);padding:0 7px;border-radius:20px;line-height:18px}
.top-right{display:flex;align-items:center;gap:12px;flex-shrink:0}
.demo-badge{font-size:11.5px;color:var(--brass);border:1px solid color-mix(in srgb,var(--brass) 38%,transparent);padding:3px 10px;border-radius:20px;white-space:nowrap}
html[lang="en"] .demo-badge{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.lang{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:2px;background:var(--surface)}
.lang button{padding:3px 11px;border-radius:999px;font-size:12.5px;color:var(--muted);line-height:1.6}
.lang button[lang="ar"]{font-family:'IBM Plex Sans Arabic',var(--sans)}
.lang button.on{background:var(--ink);color:var(--on-ink);font-weight:500}
.lang button:not(.on):hover{color:var(--ink)}
.ws{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.ws .av{width:30px;height:30px;border-radius:50%;background:var(--raised);border:1px solid var(--line-2);color:var(--ink-2);display:grid;place-items:center}
.ws .av svg{width:15px;height:15px}
.proto-strip{display:none;text-align:center;font-size:11.5px;color:var(--brass);padding:3px 16px;border-top:1px solid var(--line)}
.layer{border-bottom:1px solid var(--lapis-line);background:var(--lapis-deep)}
.layer-in{max-width:1320px;margin:0 auto;padding-inline:24px;height:40px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--lapis)}
.layer-in svg{width:15px;height:15px}
.layer-in b{font-weight:600}
.layer-in .bn{font-family:var(--naskh);font-size:18px;font-weight:400}
.layer-in .sep{opacity:.5}
.layer-in .spacer{flex:1}
.layer-in .corpus{display:flex;align-items:center;gap:8px;color:var(--ink-2);white-space:nowrap}
.layer-in .corpus i{width:6px;height:6px;border-radius:50%;background:var(--brass);display:inline-block}

.wrap{max-width:1320px;margin:0 auto;padding-inline:24px;padding-block:34px 150px}
#view.enter{animation:enter .38s cubic-bezier(.2,.7,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- shared ---------- */
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
html[lang="ar"] .eyebrow{font-family:var(--sans);font-size:12.5px;text-transform:none;font-weight:500}
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:20px;flex-wrap:wrap}
.crumbs button{color:var(--muted)}
.crumbs button:hover{color:var(--ink)}
.crumbs .back{display:inline-flex;align-items:center;gap:6px;padding-block:5px;padding-inline:10px 12px;border:1px solid var(--line-2);border-radius:20px;background:var(--surface);color:var(--ink-2);margin-inline-end:6px}
.crumbs .back:hover{border-color:var(--muted);color:var(--ink)}
.crumbs .cur{color:var(--ink-2)}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:28px}
.page-title{font-family:var(--serif);font-weight:400;font-size:clamp(32px,4.2vw,46px);line-height:1.1;letter-spacing:-.01em}
html[lang="ar"] .page-title{line-height:1.35;font-weight:500}
.page-title .alt{font-family:var(--serif);font-size:.5em;color:var(--brass);margin-inline-start:14px;font-weight:400;letter-spacing:0}
html[lang="ar"] .page-title .alt{font-size:.44em}
.page-sub{color:var(--ink-2);font-size:16px;margin-top:10px;max-width:64ch}
.h2{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
html[lang="ar"] .h2{font-size:15px}
.sec{margin-top:44px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.sec-head p{color:var(--muted);font-size:13.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:44px;padding:0 20px;border-radius:999px;font-size:14.5px;font-weight:500;transition:transform .15s,background .15s,border-color .15s,box-shadow .15s,color .15s;white-space:nowrap}
.btn svg{width:16px;height:16px;flex-shrink:0}
.btn-primary{background:var(--ink);color:var(--on-ink)}
.btn-primary:hover{background:#fff;transform:translateY(-1px);box-shadow:var(--shadow)}
.btn-primary:active{transform:none}
.btn-lapis{background:var(--lapis);color:var(--on-accent)}
.btn-lapis:hover{background:var(--lapis-2);transform:translateY(-1px);box-shadow:0 10px 26px -12px var(--lapis)}
.btn-ghost{border:1px solid var(--line-2);background:var(--surface);color:var(--ink)}
.btn-ghost:hover{border-color:var(--muted);background:var(--raised)}
.btn-sm{height:34px;padding:0 14px;font-size:13px}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{color:var(--lapis);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;white-space:nowrap;line-height:1.6}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0}
.pill svg{width:13px;height:13px}
.t-ok{background:var(--ok-soft);color:var(--ok)}
.t-yellow{background:var(--yellow-soft);color:var(--yellow)}
.t-orange{background:var(--orange-soft);color:var(--orange)}
.t-warn{background:var(--warn-soft);color:var(--warn)}
.t-risk{background:var(--risk-soft);color:var(--risk)}
.t-lapis{background:var(--lapis-soft);color:var(--lapis)}
.t-neutral{background:var(--raised);color:var(--ink-2)}
.chip svg,.link svg,.hint svg,.mis .go svg{width:14px;height:14px;flex-shrink:0}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 11px;border:1px solid var(--line-2);border-radius:999px;background:var(--surface);color:var(--ink-2);line-height:1.6}
.up{color:var(--brass);font-family:var(--mono);font-weight:500;white-space:nowrap}
html[lang="ar"] .up{font-family:var(--sans)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.divider{height:1px;background:var(--line);margin:22px 0}
.simnote{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--brass)}
.simnote i{width:6px;height:6px;border-radius:50%;background:var(--brass);display:inline-block;flex-shrink:0}
.demo-tag{display:inline-flex;align-items:center;font-size:10.5px;padding:0 7px;border-radius:5px;border:1px dashed color-mix(in srgb,var(--brass) 55%,transparent);color:var(--brass);white-space:nowrap;line-height:1.7;font-weight:500;vertical-align:middle}
html[lang="ar"] .demo-tag{font-size:11px}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--st);display:inline-block;flex-shrink:0}
.sico{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--lapis-soft);color:var(--lapis);border:1px solid var(--lapis-line);flex-shrink:0}
.sico svg{width:9px;height:9px}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:52px;align-items:center;padding-top:8px}
.wordmark{display:flex;align-items:center;gap:24px;line-height:1}
.wordmark .axis{width:1px;align-self:stretch;background:linear-gradient(var(--line),var(--brass),var(--line));margin-block:8px}
.wm-main.w-en{font-family:var(--serif);font-size:clamp(56px,7.6vw,96px);font-weight:400;letter-spacing:-.02em}
.wm-main.w-ar{font-family:var(--naskh);font-size:clamp(66px,8.8vw,118px);line-height:1.25}
.wm-sub{color:var(--brass)}
.wm-sub.w-ar{font-family:var(--naskh);font-size:clamp(46px,6vw,80px);transform:translateY(6px)}
.wm-sub.w-en{font-family:var(--serif);font-size:clamp(34px,4.2vw,54px);letter-spacing:-.01em}
.tagline{font-family:var(--serif);font-style:italic;font-size:clamp(26px,3.1vw,36px);line-height:1.2;margin-top:22px}
html[lang="ar"] .tagline{font-style:normal;font-weight:500;font-size:clamp(28px,3.3vw,40px);line-height:1.4;margin-top:14px}
.hero-copy{font-size:17px;color:var(--ink-2);margin-top:16px;max-width:50ch;line-height:1.65}
html[lang="ar"] .hero-copy{line-height:1.9}
.hero-cta{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
.hero-meta{display:flex;gap:10px 22px;margin-top:30px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.hero-meta span{display:flex;align-items:center;gap:7px}
.hero-meta i{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block}
.viz{position:relative;border:1px solid var(--line);border-radius:22px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.viz canvas{display:block;width:100%;height:460px}
.viz-top{position:absolute;inset-inline:20px;top:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.viz-title{display:flex;flex-direction:column;gap:2px}
.viz-title b{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
.viz-title b i{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block;animation:pulse 2.4s infinite}
.viz-title span{font-size:12px;color:var(--muted);max-width:40ch}
.viz-count{font-size:12px;color:var(--muted);white-space:nowrap}
.viz-bottom{position:absolute;inset-inline:20px;bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:11.5px;color:var(--muted);pointer-events:none;flex-wrap:wrap}
.legend{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.legend i.ln{width:16px;height:0;border-radius:0;border-top:1.5px solid var(--faint)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.vl{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;padding:3px 9px;border-radius:9px;background:color-mix(in srgb,var(--surface) 80%,transparent);border:1px solid transparent;transition:border-color .15s,background .15s;white-space:nowrap;line-height:1.35;z-index:2}
.vl b{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.vl span{font-size:11px;color:var(--muted)}
.vl .g{color:var(--brass)}
.vl.hot b{color:var(--lapis)}
.vl:hover,.vl.on{border-color:var(--lapis-line);background:var(--lapis-deep)}
.vl:hover b,.vl.on b{color:var(--lapis)}
.viz-tip{position:absolute;z-index:3;width:250px;padding:12px 14px;border-radius:12px;background:var(--raised);border:1px solid var(--line-2);box-shadow:var(--shadow-lg);pointer-events:none;font-size:12.5px;color:var(--ink-2);transform:translate(-50%,calc(-100% - 12px))}
.viz-tip h4{margin:0;font-size:14.5px;color:var(--ink);font-weight:600;display:flex;justify-content:space-between;gap:8px}
.viz-tip .tq{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);color:var(--ink)}
.viz-tip .tl{margin-top:6px;color:var(--muted)}
.viz-tip .go{margin-top:8px;color:var(--lapis);font-weight:500}
.flow{margin-top:80px}
.flow-head{display:flex;align-items:baseline;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.flow-head h2{font-family:var(--serif);font-weight:400;font-size:30px}
html[lang="ar"] .flow-head h2{font-weight:500;font-size:32px}
.flow-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
.flow-step{padding:24px 24px 26px;position:relative;border-inline-end:1px solid var(--line)}
.flow-step:last-child{border-inline-end:0}
.flow-step .n{font-size:11.5px;color:var(--faint)}
html[lang="en"] .flow-step .n{font-family:var(--mono);letter-spacing:.08em;font-size:11px}
.flow-step .t{font-weight:600;font-size:16px;margin-top:12px}
.flow-step .big{font-family:var(--serif);font-size:40px;line-height:1.1;margin-top:10px}
.flow-step .d{color:var(--muted);font-size:13.5px;margin-top:10px}
.flow-step .arr{position:absolute;inset-inline-end:-12px;top:24px;width:24px;height:24px;border-radius:50%;background:var(--bg);border:1px solid var(--line-2);display:grid;place-items:center;z-index:1;color:var(--muted)}
.flow-step .arr svg{width:12px;height:12px}
.flow-step.last .big{color:var(--lapis)}
.loop{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:18px;font-size:13px;color:var(--ink-2)}
.loop span{padding:4px 11px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface)}
.loop span.end{border-color:var(--lapis-line);color:var(--lapis);background:var(--lapis-deep)}
.loop svg{width:12px;height:12px;color:var(--faint)}
.messages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px;margin-top:52px;padding-top:28px;border-top:1px solid var(--line)}
.messages h3{font-size:15px;font-weight:600;display:flex;gap:10px;align-items:center}
.messages h3 .mk{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--raised);color:var(--brass)}
.messages h3 .mk svg{width:15px;height:15px}
.messages p{color:var(--ink-2);font-size:15px;margin-top:10px;max-width:36ch;font-family:var(--serif);line-height:1.5}
html[lang="ar"] .messages p{font-size:17px;line-height:1.65}
.foot{margin-top:56px;font-size:12.5px;color:var(--faint);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* ---------- dashboard ---------- */
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{padding:4px 12px;border-radius:999px;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--on-ink)}
.seg button:not(.on):hover{color:var(--ink)}
.metrics-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
.metric{padding:22px 24px;border-inline-end:1px solid var(--line)}
.metric:last-child{border-inline-end:0}
.metric .v{font-family:var(--serif);font-size:44px;line-height:1.1}
.metric .l{font-size:14px;margin-top:8px;color:var(--ink-2)}
.metric .s{font-size:12px;color:var(--muted);margin-top:4px}
html[lang="en"] .metric .s{font-family:var(--mono)}
.metric .bar{height:4px;border-radius:4px;background:var(--raised);margin-top:12px;overflow:hidden}
.metric .bar i{display:block;height:100%;background:var(--ok);border-radius:4px}
.mis-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.mis{text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:14px;transition:border-color .18s,transform .18s,box-shadow .18s,background .18s;position:relative}
.mis:hover{border-color:var(--line-2);background:var(--surface-2);transform:translateY(-2px);box-shadow:var(--shadow)}
.mis:active{transform:none}
.mis .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.mis .name{font-family:var(--serif);font-size:24px;line-height:1.2}
html[lang="ar"] .mis .name{font-weight:500;font-size:26px}
.mis .alt{font-size:12.5px;color:var(--faint);margin-top:2px}
.mis .stats{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.mis .q{font-size:13.5px;color:var(--ink-2)}
.mis .up{font-size:15px}
.mis .why{font-size:13.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;min-height:3.4em;padding-inline-end:20px}
.mis .go{position:absolute;inset-inline-end:18px;bottom:18px;opacity:0;transition:opacity .18s;color:var(--lapis)}
.mis:hover .go{opacity:1}
.mis.hot{border-color:var(--lapis-line)}
.spark{width:100%;height:40px;display:block}
.dash-row{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:14px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.readout{font-size:12px;color:var(--muted)}
html[lang="en"] .readout{font-family:var(--mono)}
.chart svg{width:100%;height:auto;display:block}
.srcs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.srcs .sv{font-family:var(--serif);font-size:28px;line-height:1.1}
.srcs .sl{font-size:12.5px;color:var(--muted);margin-top:4px}
.srcs .sb{height:4px;border-radius:4px;background:var(--raised);margin-top:10px;overflow:hidden}
.srcs .sb i{display:block;height:100%;background:var(--ink-2)}
.feed{display:flex;flex-direction:column}
.feed button{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line);text-align:start;width:100%}
.feed button:first-child{border-top:0;padding-top:0}
.feed button:hover .fq{color:var(--lapis)}
.feed .lang-tag{font-size:10.5px;color:var(--muted);border:1px solid var(--line-2);border-radius:5px;padding:0 6px;margin-top:3px;flex-shrink:0;line-height:1.7}
.feed .fq{font-size:14px;line-height:1.5;transition:color .15s;display:block}
.feed .fm{font-size:11.5px;color:var(--muted);margin-top:2px}
.feed .body{flex:1;min-width:0}
.split{display:flex;height:8px;border-radius:8px;overflow:hidden;margin:10px 0 8px;gap:2px}
.split i{display:block;height:100%}
.split-legend{display:flex;gap:16px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.split-legend span{display:flex;align-items:center;gap:6px}
.split-legend b{width:8px;height:8px;border-radius:2px;display:inline-block}

/* ---------- cluster ---------- */
.cl-stats{display:flex;gap:30px;align-items:flex-end;flex-wrap:wrap}
.cl-stats .v{font-family:var(--serif);font-size:42px;line-height:1.1}
.cl-stats .l{font-size:13px;color:var(--muted)}
.cl-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:14px;align-items:start}
.graph{position:relative;padding:8px}
.graph svg{width:100%;height:auto;display:block}
.graph-hint{padding:4px 14px 12px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.graph-hint svg{width:14px;height:14px;flex-shrink:0}
.cnode{cursor:pointer}
.cnode .ring{fill:var(--surface);stroke:var(--line-2);stroke-width:1.2;transition:stroke .2s,fill .2s}
.cnode .core{fill:var(--ink-2);transition:fill .2s}
.cnode .lbl{font-family:var(--sans);font-size:14px;font-weight:500;fill:var(--ink)}
.cnode .cnt{font-family:var(--sans);font-size:11.5px;fill:var(--muted)}
.cnode:hover .ring{stroke:var(--lapis)}
.cnode.sel .ring{stroke:var(--lapis);stroke-width:2;fill:var(--lapis-soft)}
.cnode.sel .core{fill:var(--lapis)}
.cnode.sel .lbl{fill:var(--lapis)}
.cnode .halo{fill:none;stroke:var(--lapis);stroke-width:1;opacity:0}
.cnode.sel .halo{opacity:.35;animation:halo 2.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes halo{from{transform:scale(1);opacity:.45}to{transform:scale(1.45);opacity:0}}
.sat{fill:var(--faint);opacity:.6;transition:fill .2s,opacity .2s}
.sat.on{fill:var(--lapis);opacity:.85}
.spoke{stroke:var(--line-2);stroke-width:1}
.spoke.on{stroke:var(--lapis);stroke-width:1.6}
.ovl{fill:none;stroke:var(--brass);stroke-dasharray:3 5;opacity:.7}
.ovl-lbl rect{fill:var(--bg);stroke:color-mix(in srgb,var(--brass) 45%,transparent)}
.ovl-lbl text{font-family:var(--sans);font-size:11px;fill:var(--brass)}
.center-node circle.c1{fill:var(--ink)}
.center-node text{fill:var(--on-ink);font-family:var(--serif);font-weight:500}
.center-node .ring2{fill:none;stroke:var(--brass);stroke-width:1;opacity:.6}
.side{display:flex;flex-direction:column;gap:14px}
.nd-title{font-family:var(--serif);font-size:26px;line-height:1.25}
html[lang="ar"] .nd-title{font-weight:500;font-size:28px;line-height:1.45}
.nd-meta{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.qlist{margin-top:18px;display:flex;flex-direction:column;gap:8px}
.qlist ul{padding:0;margin:4px 0 0;display:flex;flex-direction:column;gap:8px}
.qlist li{list-style:none;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.terms{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.linked{margin-top:16px;padding:14px;border-radius:12px;border:1px dashed var(--lapis-line);background:var(--lapis-deep)}
.linked .lq{font-family:var(--serif);font-size:19px;margin-top:4px;line-height:1.4}
html[lang="ar"] .linked .lq{font-weight:500;font-size:21px;line-height:1.55}
.linked .row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.insights{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;margin-top:14px}
.insight-q{font-family:var(--serif);font-size:23px;line-height:1.4;margin-top:14px}
html[lang="ar"] .insight-q{font-size:25px;line-height:1.6;font-weight:500}
.co{margin-top:20px;display:flex;flex-direction:column;gap:10px}
.co-row{display:grid;grid-template-columns:190px 1fr 48px;gap:12px;align-items:center;font-size:13px}
.co-row .track{height:8px;border-radius:8px;background:var(--raised);overflow:hidden}
.co-row .track i{display:block;height:100%;background:var(--ink-2);border-radius:8px;transform-origin:left;animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
html[dir="rtl"] .co-row .track i{transform-origin:right}
.co-row.hl .track i{background:var(--brass)}
.co-row .pc{font-size:12px;text-align:end;color:var(--ink-2)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.reco{display:flex;flex-direction:column;gap:14px;background:var(--lapis-deep);border-color:var(--lapis-line)}
.reco .rt{font-family:var(--serif);font-size:22px;line-height:1.45}
html[lang="ar"] .reco .rt{font-size:24px;font-weight:500;line-height:1.6}
.handoff{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;margin-top:4px}
.handoff .hn{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);font-size:13.5px;font-weight:600}
.handoff .hn svg{width:18px;height:18px;flex-shrink:0}
.handoff .hn small{display:block;color:var(--muted);font-size:11.5px;font-weight:400}
.handoff .hn.a svg{color:var(--brass)}
.handoff .hn.b{border-color:var(--lapis);background:var(--lapis-soft);color:var(--lapis)}
.handoff .hn.b small{color:var(--lapis-2)}
.handoff .hl{height:2px;position:relative;background:repeating-linear-gradient(90deg,var(--lapis) 0 6px,transparent 6px 11px);opacity:.85}
html[dir="rtl"] .handoff .hl{background:repeating-linear-gradient(270deg,var(--lapis) 0 6px,transparent 6px 11px)}
.handoff .hl::after{content:"";position:absolute;inset-inline-end:-3px;top:-4px;border:5px solid transparent;border-inline-start-color:var(--lapis)}
.reco .cq{font-size:13.5px;color:var(--ink-2);padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);line-height:1.7}
.reco .cq b{font-family:var(--serif);font-weight:500;color:var(--ink);font-size:17px}
.reco .btn{height:54px;font-size:15.5px;align-self:stretch}

/* ---------- bayyin ---------- */
.b-head{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.b-mark{width:56px;height:56px;border-radius:15px;background:var(--lapis-soft);border:1px solid var(--lapis-line);display:grid;place-items:center;color:var(--lapis);flex-shrink:0}
.b-mark svg{width:28px;height:28px}
.b-title{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;font-weight:400}
.b-title .w-ar{font-family:var(--naskh);font-size:clamp(46px,5vw,62px);line-height:1.3}
.b-title .w-en{font-family:var(--serif);font-size:clamp(36px,4.4vw,52px);line-height:1.1;letter-spacing:.02em}
.b-title .w-2{color:var(--lapis)}
.b-title .w-2.w-en{font-size:22px;letter-spacing:.06em}
.b-title .w-2.w-ar{font-size:30px}
.b-sub{font-family:var(--serif);font-size:20px;color:var(--ink);margin-top:2px}
html[lang="ar"] .b-sub{font-weight:500;font-size:23px}
.b-desc{color:var(--ink-2);margin-top:4px;max-width:62ch}
.b-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;margin-top:28px;align-items:start}
.composer{padding:0;overflow:hidden}
.tabs{display:flex;gap:4px;padding:12px 12px 0}
.tabs button{padding:8px 14px;font-size:13.5px;color:var(--muted);display:flex;gap:8px;align-items:center;border-bottom:2px solid transparent}
.tabs button svg{width:15px;height:15px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--lapis)}
.tabs button:hover{color:var(--ink)}
.composer-body{padding:20px 22px;border-top:1px solid var(--line)}
.composer textarea{width:100%;min-height:150px;border:0;outline:0;resize:vertical;background:transparent;font-family:var(--serif);font-size:27px;line-height:1.45;color:var(--ink)}
html[lang="ar"] .composer textarea{font-weight:500;line-height:1.6}
.composer textarea::placeholder{color:var(--faint)}
.composer-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:14px;padding-inline:22px 16px;border-top:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap}
.composer-foot .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.drop{border:1.5px dashed var(--line-2);border-radius:14px;padding:26px;text-align:center;color:var(--muted);font-size:14px;display:flex;flex-direction:column;align-items:center;gap:8px;transition:border-color .15s,background .15s;width:100%}
.drop:hover{border-color:var(--lapis);background:var(--lapis-deep)}
.drop svg{width:28px;height:28px;color:var(--lapis)}
.shot{display:grid;grid-template-columns:200px 1fr;gap:18px;align-items:start}
.shot-img{border-radius:12px;border:1px solid var(--line);background:var(--surface-2);padding:12px;font-size:11.5px}
.shot-img .u{display:flex;gap:8px;align-items:center}
.shot-img .u i{width:22px;height:22px;border-radius:50%;background:var(--line-2);display:inline-block}
.shot-img .u b{display:block;height:6px;width:70px;background:var(--line-2);border-radius:3px}
.shot-img p{margin-top:10px;font-weight:600;font-size:13px;line-height:1.6}
.shot-img .bars{display:flex;gap:12px;margin-top:12px}
.shot-img .bars b{height:5px;width:28px;border-radius:3px;background:var(--line-2);display:block}
.ocr{font-size:12.5px;color:var(--muted)}
.ocr .ot{font-family:var(--serif);font-size:21px;color:var(--ink);margin-top:6px;line-height:1.5;font-weight:500}
.examples{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.examples .lbl{font-size:12.5px;color:var(--muted)}
.ex-row{display:flex;flex-wrap:wrap;gap:8px}
.ex{font-size:13px;padding:6px 13px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);text-align:start;transition:border-color .15s,color .15s}
.ex:hover{border-color:var(--lapis);color:var(--lapis)}
.how ol{list-style:none;margin:14px 0 0;padding:0;position:relative}
.how ol::before{content:"";position:absolute;inset-inline-start:11.5px;top:12px;bottom:12px;width:1px;background:var(--line-2)}
.how li{display:flex;gap:14px;padding:7px 0;position:relative;font-size:14px}
.how li .k{width:24px;height:24px;border-radius:50%;background:var(--surface);border:1px solid var(--line-2);display:grid;place-items:center;font-size:11.5px;color:var(--muted);flex-shrink:0;position:relative}
.how li b{font-weight:600}
.how li span{color:var(--muted);font-size:13px;display:block}
.how li.last .k{background:var(--lapis);border-color:var(--lapis);color:var(--on-accent)}
.recent button{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:start;font-size:13.5px}
.recent button:first-of-type{border-top:0}
.recent button:hover span:first-child{color:var(--lapis)}
.loading{padding:30px 26px}
.loading .lc{font-family:var(--serif);font-size:24px;line-height:1.5;font-weight:500}
.steps{margin-top:22px;display:flex;flex-direction:column;gap:12px}
.steps div{display:flex;gap:12px;align-items:center;font-size:14px;color:var(--faint);transition:color .25s}
.steps div .ic{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;flex-shrink:0}
.steps div.run{color:var(--ink)}
.steps div.run .ic{border-color:var(--lapis);border-inline-end-color:transparent;animation:spin .8s linear infinite}
.steps div.done{color:var(--ink-2)}
.steps div.done .ic{background:var(--lapis);border-color:var(--lapis)}
.steps div.done .ic::after{content:"";width:8px;height:4px;border-left:1.6px solid var(--on-accent);border-bottom:1.6px solid var(--on-accent);transform:rotate(-45deg) translate(1px,-1px)}
.steps .num{margin-inline-start:auto;font-size:12px;color:var(--muted)}
@keyframes spin{to{transform:rotate(360deg)}}
.progress{height:3px;background:var(--raised);border-radius:3px;overflow:hidden;margin-top:24px}
.progress i{display:block;height:100%;width:0;background:var(--lapis);transition:width .5s ease}

/* ---------- analysis ---------- */
.claim-hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px}
.claim-card{padding:30px 32px;position:relative;overflow:hidden}
.claim-card .qm{position:absolute;inset-inline-end:22px;top:20px;width:96px;height:96px;color:var(--brass);opacity:.08;pointer-events:none}
.claim-card .qm svg{width:100%;height:100%;stroke-width:.8}
.claim-text{font-family:var(--serif);font-size:clamp(28px,3.3vw,40px);line-height:1.25;letter-spacing:-.01em;position:relative;margin-top:12px}
html[lang="ar"] .claim-text{font-weight:500;line-height:1.5}
.claim-alt{font-family:var(--serif);font-size:19px;color:var(--muted);margin-top:12px;position:relative;line-height:1.5}
.claim-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;position:relative}
.assess{padding:24px;display:flex;flex-direction:column;gap:14px}
.assess .verdict{font-family:var(--serif);font-size:23px;line-height:1.35}
html[lang="ar"] .assess .verdict{font-weight:500;font-size:25px;line-height:1.55}
.assess .note{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.assess .note svg{width:14px;height:14px;flex-shrink:0;margin-top:4px}
.ev-bar{display:flex;gap:3px;height:10px}
.ev-bar i{flex:1;border-radius:3px}
.ev-legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.ev-legend span{display:flex;align-items:center;gap:6px}
.concepts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.concept{text-align:start;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .15s,box-shadow .15s}
.concept:hover{border-color:var(--lapis-line);transform:translateY(-2px);box-shadow:var(--shadow)}
.concept .ck{font-size:11.5px;color:var(--faint)}
.concept .cn{font-weight:600;font-size:16.5px}
.concept .ca{font-size:12px;color:var(--faint)}
.concept .cq{font-size:13.5px;color:var(--ink-2);line-height:1.6}
.concept .ce{display:flex;gap:4px;margin-top:6px}
.concept .ce i{width:18px;height:5px;border-radius:3px}

.map-card{padding:0;overflow:hidden;position:relative}
.map-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.map-path{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;font-weight:500}
.map-path svg{width:11px;height:11px;color:var(--faint)}
.map-head .hint{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
.map-scroll{overflow-x:auto;background:radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 1.2px) 0 0/22px 22px}
.emap{position:relative;min-width:1150px;display:grid;grid-template-columns:1.05fr 1fr 1.2fr 1fr 1fr 1fr;gap:34px;padding:20px 22px 28px}
.emap svg.edges{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.lane{display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
.lane-h{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:6px;gap:6px}
.lane-h b{font-size:13px;font-weight:600;color:var(--ink-2)}
.lane-h b em{font-style:normal;color:var(--faint);font-weight:400;margin-inline-start:6px}
.lane-h span{font-size:10.5px;color:var(--faint);font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase}
html[lang="en"] .lane-h b{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:500}
html[lang="en"] .lane-h span{font-family:var(--sans);text-transform:none;letter-spacing:0;font-size:12px}
.lane-body{display:flex;flex-direction:column;gap:12px;justify-content:center;flex:1}
.mnode{text-align:start;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:10px 13px;transition:opacity .25s,border-color .2s,box-shadow .2s,background .2s;position:relative;width:100%}
.mnode:hover{border-color:var(--lapis);box-shadow:0 8px 22px -14px var(--lapis)}
.mnode .mk{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;justify-content:space-between}
.mnode .mt{font-size:13.5px;font-weight:500;margin-top:3px;line-height:1.45}
.mnode .ms{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.mnode.claim{background:var(--ink);color:var(--on-ink);border-color:transparent;padding:18px}
.mnode.claim .mk{color:color-mix(in srgb,var(--on-ink) 60%,transparent)}
.mnode.claim .mt{font-family:var(--serif);font-size:21px;font-weight:500;line-height:1.35;margin-top:8px}
html[lang="ar"] .mnode.claim .mt{font-size:22px;line-height:1.55}
.mnode.ev{padding-inline-start:15px}
.mnode.ev::before{content:"";position:absolute;inset-inline-start:-1px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--st)}
.mnode.src .row{display:flex;gap:10px;align-items:center}
.badge{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-family:var(--mono);font-size:11px;background:var(--raised);color:var(--ink-2);flex-shrink:0}
.mnode.src.untrusted{border-style:dashed}
.mnode.ctx{background:var(--surface-2);border-style:dashed}
.mnode.concl{border-color:var(--lapis-line);background:var(--lapis-deep);padding:16px}
.mnode.concl .mt{font-family:var(--serif);font-size:18px;line-height:1.45}
html[lang="ar"] .mnode.concl .mt{font-size:19px;line-height:1.6}
.mnode.concl .cs{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:12px;color:var(--lapis)}
.emap.focus .mnode:not(.on){opacity:.26}
.mnode.sel{border-color:var(--lapis);box-shadow:0 0 0 3px var(--lapis-soft),0 10px 26px -14px var(--lapis)}
.mnode.claim.sel{box-shadow:0 0 0 3px var(--lapis-line)}
.edges path.edge{fill:none;stroke:var(--line-2);stroke-width:1.3;transition:stroke .25s,stroke-width .25s,opacity .25s}
.edges path.edge.st-ok{stroke:color-mix(in srgb,var(--ok) 50%,var(--line-2))}
.edges path.edge.st-ctx{stroke:color-mix(in srgb,var(--yellow) 50%,var(--line-2))}
.edges path.edge.st-interp{stroke:color-mix(in srgb,var(--orange) 50%,var(--line-2))}
.edges path.edge.st-low{stroke:color-mix(in srgb,var(--risk) 55%,var(--line-2));stroke-dasharray:.03 .025}
.edges path.edge.to-k{stroke:color-mix(in srgb,var(--lapis) 40%,var(--line-2))}
.emap.focus .edges path.edge{opacity:.2}
.emap.focus .edges path.edge.on{opacity:1;stroke:var(--lapis);stroke-width:2}
.edges path.flow{fill:none;stroke:var(--lapis);stroke-width:2.2;stroke-dasharray:2 10;stroke-linecap:round;opacity:0}
.emap.focus .edges path.flow.on{opacity:.9;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.edges.draw path.edge{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s cubic-bezier(.4,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.emap.intro .mnode{animation:pop .5s ease both}
@keyframes pop{from{opacity:0}to{opacity:1}}
.map-foot{display:flex;gap:8px 18px;flex-wrap:wrap;align-items:center;padding:14px 22px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.map-foot span{display:flex;align-items:center;gap:7px}
.map-foot .ln{width:22px;height:0;border-top:2px solid var(--lapis);display:inline-block}

.acc{display:flex;flex-direction:column}
.acc-item{border-top:1px solid var(--line)}
.acc-item:first-child{border-top:0}
.acc-h{display:flex;align-items:center;gap:14px;width:100%;padding:15px 22px;text-align:start}
.acc-h:hover{background:var(--surface-2)}
.acc-h .code{font-family:var(--mono);font-size:12px;color:var(--muted);width:24px;direction:ltr}
.acc-h .tt{flex:1;font-weight:500;min-width:0}
.acc-h .tt span{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.acc-h .chev{transition:transform .2s;color:var(--muted)}
.acc-item.open .chev{transform:rotate(180deg)}
.acc-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.acc-item.open .acc-b{grid-template-rows:1fr}
.acc-b>div{overflow:hidden}
.acc-in{padding-block:0 20px;padding-inline:60px 22px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;align-items:start}
.passage{border-inline-start:2px solid var(--brass);padding-block:4px;padding-inline-start:16px}
.passage .pa{font-family:var(--naskh);font-size:27px;direction:rtl;text-align:right;line-height:1.75}
.passage .pe{font-family:var(--serif);font-size:18px;line-height:1.5;color:var(--ink)}
.passage .pe.para{color:var(--ink-2);font-size:16px;line-height:1.7}
html[lang="en"] .passage .pe.para{font-style:italic}
.passage .ps{font-size:12px;color:var(--muted);margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.conclusion{padding:28px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:start}
.conclusion .ct{font-family:var(--serif);font-size:20px;line-height:1.6}
html[lang="ar"] .conclusion .ct{font-size:21px;line-height:1.85}
.challenge-cta{display:flex;flex-direction:column;gap:12px;padding:22px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.challenge-cta p{font-size:13.5px;color:var(--muted)}
.btn-challenge{height:54px;font-size:15.5px;border:1.5px solid var(--ink);background:transparent;color:var(--ink)}
.btn-challenge:hover{background:var(--ink);color:var(--on-ink);transform:translateY(-1px)}
.btn-challenge svg{width:18px;height:18px}
.chal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.chal-item{padding:22px}
.chal-item h3{font-size:15.5px;font-weight:600;display:flex;gap:10px;align-items:center}
.chal-item h3 .ico{width:30px;height:30px;border-radius:8px;background:var(--raised);display:grid;place-items:center;color:var(--ink-2)}
.chal-item h3 .ico svg{width:15px;height:15px}
.chal-item p{font-size:14px;color:var(--ink-2);margin-top:12px;line-height:1.75}
.chal-item ul{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.chal-item li{font-size:13.5px;color:var(--ink-2);display:flex;gap:10px;align-items:flex-start;line-height:1.65}
.chal-item li .sdot,.chal-item li .sico{margin-top:6px}
.stop{margin-top:14px;padding:26px 28px;border-radius:var(--r-lg);border:1.5px solid color-mix(in srgb,var(--risk) 45%,transparent);background:var(--risk-soft);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:22px;align-items:center}
.stop .si{width:50px;height:50px;border-radius:50%;border:1.5px solid var(--risk);display:grid;place-items:center;color:var(--risk)}
.stop .si svg{width:22px;height:22px}
.stop h3{font-family:var(--serif);font-weight:500;font-size:24px;color:var(--ink);line-height:1.4}
.stop p{font-size:13.5px;color:var(--ink-2);margin-top:6px;max-width:66ch}
.stop .rule{font-size:12.5px;color:var(--risk);margin-top:10px;display:flex;gap:8px;align-items:flex-start}
.stop .rule svg{width:14px;height:14px;flex-shrink:0;margin-top:3px}
.thinking{padding:28px;display:flex;align-items:center;gap:16px;color:var(--ink-2);margin-top:14px}
.spinner{width:22px;height:22px;border-radius:50%;border:2px solid var(--lapis-line);border-top-color:var(--lapis);animation:spin .8s linear infinite;flex-shrink:0}
.insuff{padding:36px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px;align-items:start}
.insuff h2{font-family:var(--serif);font-weight:500;font-size:29px;line-height:1.4}
.insuff .ring{width:56px;height:56px;border-radius:50%;border:2px dashed var(--risk);margin-bottom:18px;display:grid;place-items:center;color:var(--risk)}
.insuff .ring svg{width:22px;height:22px}

/* ---------- drawer & modal ---------- */
.scrim{position:fixed;inset:0;background:var(--backdrop);opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;inset-inline-end:0;bottom:0;width:min(480px,100vw);background:var(--surface);border-inline-start:1px solid var(--line-2);box-shadow:var(--shadow-lg);transform:translateX(102%);transition:transform .34s cubic-bezier(.2,.7,.2,1);z-index:61;display:flex;flex-direction:column;padding-top:var(--top)}
html[dir="rtl"] .drawer{transform:translateX(-102%)}
.drawer.on,html[dir="rtl"] .drawer.on{transform:none}
.dr-head{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;border-bottom:1px solid var(--line);gap:10px}
.dr-nav{display:flex;gap:6px}
.icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line-2);display:grid;place-items:center;color:var(--ink-2);background:var(--surface)}
.icon-btn:hover{border-color:var(--muted);color:var(--ink)}
.icon-btn svg{width:16px;height:16px}
.icon-btn[disabled]{opacity:.3;pointer-events:none}
.dr-body{padding:22px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:22px}
.dr-title{font-family:var(--serif);font-size:27px;line-height:1.3;font-weight:400}
html[lang="ar"] .dr-title{font-weight:500;font-size:29px;line-height:1.45}
.dr-sec h4{margin:0 0 10px;font-size:12px;color:var(--muted);font-weight:600}
html[lang="en"] .dr-sec h4{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:500}
.dr-sec p{font-size:14.5px;color:var(--ink-2);line-height:1.75}
.status-big{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px}
.status-big .sb-dot{width:12px;height:12px;border-radius:50%;background:var(--st);box-shadow:0 0 0 4px color-mix(in srgb,var(--st) 20%,transparent);flex-shrink:0}
.status-big b{font-weight:600;font-size:14.5px}
.status-big span{font-size:12.5px;color:var(--ink-2);display:block}
.status-big .sico{width:24px;height:24px}
.status-big .sico svg{width:13px;height:13px}
.flagrow{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--lapis);margin-top:10px}
.trace{position:relative;display:flex;flex-direction:column}
.trace-step{display:grid;grid-template-columns:30px 1fr;gap:12px;position:relative;padding-bottom:14px}
.trace-step:last-child{padding-bottom:0}
.trace-step::before{content:"";position:absolute;inset-inline-start:14.5px;top:24px;bottom:-2px;width:1px;background:var(--lapis-line)}
.trace-step:last-child::before{display:none}
.trace-step .tk{width:30px;height:30px;border-radius:50%;border:1px solid var(--lapis-line);background:var(--lapis-deep);display:grid;place-items:center;font-family:var(--mono);font-size:10px;color:var(--lapis);position:relative;z-index:1}
.trace-step.cur .tk{background:var(--lapis);color:var(--on-accent);border-color:var(--lapis)}
.trace-step .tl{font-size:11.5px;color:var(--muted)}
.trace-step .tv{font-size:14px;line-height:1.5}
.trace-cap{font-size:12.5px;color:var(--lapis);margin-top:14px;display:flex;gap:8px;align-items:center}
.trace-cap svg{width:14px;height:14px}
.dr-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.meter{display:flex;align-items:center;gap:12px;font-size:13px}
.meter .mtrack{flex:1;height:6px;border-radius:6px;background:var(--raised);position:relative}
.meter .mtrack i{display:block;height:100%;border-radius:6px}
.meter .mtrack em{position:absolute;top:-4px;bottom:-4px;width:1.5px;background:var(--ink-2);inset-inline-start:75%}
.meter-cap{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint);margin-top:6px;gap:10px}
.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:24px 16px;pointer-events:none}
.modal .sheet{width:min(840px,100%);max-height:min(88vh,1000px);background:var(--surface);border:1px solid var(--line-2);border-radius:20px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;opacity:0;transform:translateY(14px) scale(.985);transition:opacity .25s,transform .3s cubic-bezier(.2,.7,.2,1);pointer-events:none}
.modal.on{pointer-events:auto}
.modal.on .sheet{opacity:1;transform:none;pointer-events:auto}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;border-bottom:1px solid var(--line);gap:12px;flex-wrap:wrap}
.sheet-body{overflow-y:auto;padding:28px 36px}
.sheet-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.draft-banner{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);color:var(--warn);font-size:13.5px;font-weight:500}
.draft-banner svg{width:16px;height:16px;flex-shrink:0}
.brief h2{font-family:var(--serif);font-weight:400;font-size:32px;line-height:1.25}
html[lang="ar"] .brief h2{font-weight:500;font-size:33px;line-height:1.45}
.brief .alt-title{font-family:var(--serif);font-size:19px;color:var(--brass);margin-top:6px}
.brief h4{font-size:12.5px;color:var(--muted);font-weight:600;margin:26px 0 10px;display:flex;align-items:center;gap:10px}
.brief h4::after{content:"";flex:1;height:1px;background:var(--line)}
html[lang="en"] .brief h4{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:500}
.brief p,.brief li{font-size:14.5px;line-height:1.75;color:var(--ink-2)}
.brief ul,.brief ol{margin:0;padding-inline-start:20px}
.brief .facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:20px}
.brief .facts div{background:var(--surface);padding:12px 14px}
.brief .facts span{font-size:11.5px;color:var(--muted);display:block}
.brief .facts b{font-weight:500;font-size:14px}
.beats{display:flex;flex-direction:column}
.beat{display:grid;grid-template-columns:62px 1fr;gap:14px;padding:11px 0;border-top:1px solid var(--line)}
.beat:first-child{border-top:0}
.beat .ts{font-family:var(--mono);font-size:12px;color:var(--lapis);direction:ltr;text-align:start}
.beat b{font-weight:600;font-size:14px;color:var(--ink)}
.beat p{font-size:13.5px;margin-top:2px}
.src-list{list-style:none;padding:0 !important;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.src-list li{font-size:13px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;display:flex;gap:10px;align-items:center;line-height:1.5}
.skel{display:flex;flex-direction:column;gap:12px;padding:10px 0}
.skel i{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--raised),var(--line-2),var(--raised));background-size:200% 100%;animation:shimmer 1.2s infinite}
@keyframes shimmer{to{background-position:-200% 0}}

/* ---------- review ---------- */
.rv-grid{display:grid;grid-template-columns:310px minmax(0,1fr);gap:14px;align-items:start}
.queue{padding:8px}
.queue .qh{padding:12px 12px 10px;display:flex;justify-content:space-between;align-items:center}
.qitem{display:flex;flex-direction:column;gap:8px;padding:14px 12px;border-radius:12px;width:100%;text-align:start;transition:background .15s;border:1px solid transparent}
.qitem:hover{background:var(--surface-2)}
.qitem.on{background:var(--lapis-deep);border-color:var(--lapis-line)}
.qitem .qid{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.qitem .qc{font-size:14px;line-height:1.5;font-weight:500}
.case{padding:28px}
.trust{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:24px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.trust div{padding:10px 14px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:10px;border-inline-end:1px solid var(--line);background:var(--surface-2)}
.trust div:last-child{border-inline-end:0}
.trust div i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-2);font-size:11px;flex-shrink:0}
.trust div.done{color:var(--ink-2)}
.trust div.done i{background:var(--raised);border-color:transparent;color:var(--ok)}
.trust div.cur{background:var(--lapis-deep);color:var(--lapis);font-weight:500}
.trust div.cur i{background:var(--lapis);color:var(--on-accent);border-color:var(--lapis)}
.case-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.case-claim{font-family:var(--serif);font-size:clamp(24px,2.8vw,32px);line-height:1.35;margin-top:8px;max-width:32ch}
html[lang="ar"] .case-claim{font-weight:500;line-height:1.55}
.case-meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px}
.case-meta div{padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:12px;color:var(--muted)}
.case-meta b{display:block;color:var(--ink);font-weight:500;font-size:13.5px;margin-top:2px}
.reason{margin-top:20px;padding:18px 20px;border-radius:14px;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.reason h4{margin:0;font-size:14px;font-weight:600;color:var(--warn);display:flex;gap:8px;align-items:center}
.reason h4 svg{width:15px;height:15px}
.reason ul{margin:10px 0 0;padding-inline-start:18px}
.reason li{font-size:14px;color:var(--ink-2);margin-top:4px;line-height:1.7}
.reason .rule{font-size:12.5px;color:var(--warn);margin-top:12px;padding-top:10px;border-top:1px dashed color-mix(in srgb,var(--warn) 30%,transparent);display:flex;gap:8px;align-items:flex-start}
.reason .rule svg{width:14px;height:14px;flex-shrink:0;margin-top:3px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;margin-top:26px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl td{padding:10px 0;border-top:1px solid var(--line);vertical-align:top}
.tbl tr:first-child td{border-top:0}
.tbl td.c{font-family:var(--mono);font-size:11.5px;color:var(--muted);width:34px}
.tbl td.r{text-align:end;white-space:nowrap}
.draft{margin-top:26px;border:1px solid var(--line);border-radius:14px}
.draft summary{padding:14px 18px;cursor:pointer;font-size:13.5px;font-weight:500;display:flex;justify-content:space-between;list-style:none}
.draft summary::-webkit-details-marker{display:none}
.draft[open] summary{border-bottom:1px solid var(--line)}
.draft p{padding:16px 18px;font-family:var(--serif);font-size:17px;line-height:1.75;color:var(--ink-2)}
.notes{margin-top:22px}
.notes label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:8px}
.notes textarea{width:100%;min-height:84px;border:1px solid var(--line-2);border-radius:12px;padding:12px 14px;background:var(--surface-2);resize:vertical;font-size:14px;outline:0;line-height:1.7}
.notes textarea:focus{border-color:var(--lapis)}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn-approve{background:var(--ok);color:var(--on-ink)}
.btn-approve:hover{filter:brightness(1.08);transform:translateY(-1px)}
.log{margin-top:26px}
.log ol{list-style:none;margin:10px 0 0;padding:0}
.log li{display:grid;grid-template-columns:78px 1fr;gap:12px;font-size:13px;padding:6px 0;color:var(--ink-2)}
.log li span{font-family:var(--mono);font-size:11.5px;color:var(--muted);direction:ltr;text-align:start}
.log li.new{animation:enter .4s ease}
.next{margin-top:22px;padding:18px 20px;border-radius:14px;background:var(--ink);color:var(--on-ink);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.next p{font-size:14px}
.next p b{font-family:var(--serif);font-weight:500;font-size:20px;display:block}
.next .btn{background:var(--on-ink);color:var(--ink)}

/* ---------- content ---------- */
.lineage{display:flex;align-items:center;flex-wrap:wrap;font-size:12.5px;margin-bottom:22px;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:5px;width:fit-content;max-width:100%}
.lineage button,.lineage span.lg{padding:5px 12px;border-radius:999px;display:flex;align-items:center;gap:7px;color:var(--ink-2)}
.lineage button:hover{background:var(--raised);color:var(--ink)}
.lineage .sep{color:var(--faint);display:flex}
.lineage .sep svg{width:12px;height:12px}
.opp{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);overflow:hidden}
.opp-main{padding:32px}
.opp-main h2{font-family:var(--serif);font-weight:400;font-size:clamp(28px,3.4vw,38px);line-height:1.25;margin-top:14px}
html[lang="ar"] .opp-main h2{font-weight:500;line-height:1.45}
.opp-main .alt-title{font-family:var(--serif);font-size:19px;color:var(--brass);margin-top:6px}
.opp-main .why{margin-top:18px;color:var(--ink-2);font-size:15.5px;max-width:58ch}
.ai-note{display:flex;gap:10px;align-items:flex-start;margin-top:18px;padding:12px 14px;border-radius:12px;background:var(--lapis-deep);border:1px solid var(--lapis-line);color:var(--ink-2);font-size:13.5px;max-width:62ch}
.ai-note svg{width:16px;height:16px;color:var(--lapis);flex-shrink:0;margin-top:4px}
.opp-attrs{background:var(--surface-2);border-inline-start:1px solid var(--line);padding:26px 28px;display:flex;flex-direction:column}
.attr{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-top:1px solid var(--line);font-size:14px;gap:12px}
.attr:first-child{border-top:0}
.attr span{color:var(--muted)}
.attr b{font-weight:500;display:flex;align-items:center;gap:8px;text-align:end}
.reach{display:inline-flex;gap:3px}
.reach i{width:5px;height:14px;border-radius:2px;background:var(--line-2)}
.reach i.on{background:var(--ok)}
.opp-cta{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap;align-items:center}
.opp-small{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.os{padding:20px;display:flex;flex-direction:column;gap:10px;text-align:start;transition:border-color .15s,transform .15s,background .15s}
.os:hover{border-color:var(--line-2);background:var(--surface-2);transform:translateY(-2px)}
.os .ot{font-family:var(--serif);font-size:20px;line-height:1.4}
html[lang="ar"] .os .ot{font-weight:500;font-size:21px;line-height:1.55}
.os .om{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.os .open{font-size:12.5px;color:var(--lapis);display:flex;align-items:center;gap:6px}
.os .open svg{width:13px;height:13px}

/* ---------- story bar & toast ---------- */
.story{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:8px;padding:6px;border-radius:18px;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line-2);box-shadow:var(--shadow-lg);max-width:calc(100vw - 32px)}
.story .sq{display:flex;flex-direction:column;padding-inline:10px 14px;border-inline-end:1px solid var(--line);min-width:0;max-width:270px}
.story .sq small{font-size:10.5px;color:var(--muted);white-space:nowrap}
html[lang="en"] .story .sq small{font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase}
.story .sq b{font-family:var(--serif);font-weight:500;font-size:15px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
html[lang="en"] .story .sq b{font-style:italic;font-weight:400}
.story .track{display:flex;align-items:center;list-style:none;margin:0;padding:0}
.story .track li{display:flex;align-items:center}
.story .track .ln{width:10px;height:1px;background:var(--line-2)}
.story .track .ln.on{background:var(--lapis)}
.story .st{display:flex;align-items:center;gap:7px;padding-block:5px;padding-inline:6px 10px;border-radius:999px;font-size:12.5px;color:var(--muted);white-space:nowrap;transition:background .15s,color .15s}
.story .st i{font-style:normal;font-size:11px;width:21px;height:21px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-2);flex-shrink:0}
.story .st i svg{width:10px;height:10px}
.story .st:hover{background:var(--raised);color:var(--ink)}
.story .st.done{color:var(--ink-2)}
.story .st.done i{background:var(--lapis-soft);border-color:var(--lapis-line);color:var(--lapis)}
.story .st.on{background:var(--lapis-soft);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px var(--lapis-line)}
.story .st.on i{background:var(--lapis);border-color:var(--lapis);color:var(--on-accent);font-weight:600}
.story .nx{height:38px;padding-inline:16px 12px;border-radius:12px;background:var(--lapis);color:var(--on-accent);font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap}
.story .nx:hover{background:var(--lapis-2)}
.story .nx svg,.story .pv svg{width:14px;height:14px}
.story .pv{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:var(--ink-2);flex-shrink:0}
.story .pv:hover{background:var(--raised)}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--ink);color:var(--on-ink);padding:10px 16px;border-radius:12px;font-size:13.5px;opacity:0;transition:opacity .2s,transform .25s;z-index:80;pointer-events:none;display:flex;gap:10px;align-items:center;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast i{width:8px;height:8px;border-radius:50%;background:var(--ok);flex-shrink:0}

/* ---------- responsive ---------- */
@media (max-width:1240px){
  .story .st:not(.on) span{display:none}
  .story .st:not(.on){padding:5px}
  .ws span{display:none}
}
@media (max-width:1100px){
  .demo-badge{display:none}
  .proto-strip{display:block}
}
@media (max-width:980px){
  .hero,.cl-grid,.insights,.b-grid,.claim-hero,.conclusion,.dash-row,.opp,.rv-grid,.insuff{grid-template-columns:minmax(0,1fr)}
  .mis-grid,.concepts,.messages{grid-template-columns:repeat(2,minmax(0,1fr))}
  .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .metric:nth-child(2){border-inline-end:0}
  .metric:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .flow-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .flow-step:nth-child(2){border-inline-end:0}
  .flow-step:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .flow-step:nth-child(2) .arr{display:none}
  .opp-attrs{border-inline-start:0;border-top:1px solid var(--line)}
  .opp-small{grid-template-columns:minmax(0,1fr)}
  .stop{grid-template-columns:auto minmax(0,1fr)}
  .stop .btn{grid-column:1 / -1;justify-self:start}
  .case-meta{grid-template-columns:repeat(2,minmax(0,1fr))}
  .story .sq{display:none}
}
@media (max-width:720px){
  .topbar-in,.layer-in,.wrap{padding-inline:16px}
  .topbar-in{gap:12px;height:56px}
  .brand .w-sep,.brand .w-2{display:none}
  .ws{display:none}
  .wrap{padding-block:26px 130px}
  .mis-grid,.concepts,.chal-grid,.messages,.two,.src-list,.trust{grid-template-columns:minmax(0,1fr)}
  .trust div{border-inline-end:0;border-bottom:1px solid var(--line)}
  .trust div:last-child{border-bottom:0}
  .metric{padding:18px}
  .metric .v{font-size:34px}
  .flow-grid{grid-template-columns:minmax(0,1fr)}
  .flow-step{border-inline-end:0 !important;border-bottom:1px solid var(--line)}
  .flow-step:last-child{border-bottom:0}
  .flow-step .arr{display:none}
  .viz canvas{height:400px}

function sparkline(data,w,h,color){
  const max=Math.max(...data),min=Math.min(...data)*.8;
  const pts=data.map((v,i)=>[(i/(data.length-1))*(w-6)+3,h-4-((v-min)/(max-min))*(h-10)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const last=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${d} L${last[0].toFixed(1)},${h} L3,${h} Z" fill="${color}" opacity=".1"/><path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="${color}"/></svg>`;
}

function go(route,param){
  state.focusEvidence=false;
  if(route===state.route&&(param||null)===state.param){ window.scrollTo({top:0,behavior:RM?'auto':'smooth'}); return; }
  state.stack.push({route:state.route,param:state.param});
  state.route=route; state.param=param||null;
  render();
}
function back(){ const p=state.stack.pop(); if(!p){ state.route='home'; state.param=null; } else { state.route=p.route; state.param=p.param; } render(); }
function render(soft){
  cleanups.forEach(f=>{ try{f();}catch(e){} }); cleanups=[];
  timers.forEach(clearTimeout); timers=[]; state.loading=false;
  if(soft&&state.challenge==='loading') state.challenge='open';
  if(soft&&state.brief==='loading') state.brief='open';
  const keepDrawer=soft&&state.drawerId, keepBrief=soft&&state.brief!=='closed';
  if(!soft) closeOverlays(true);
  const y=window.scrollY, v=$('#view');
  v.innerHTML=(SCREENS[state.route]||SCREENS.home)();
  if(!soft){ v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter'); }

  window.scrollTo(0,soft?y:0);
  renderChrome();

MOUNT.home=function(){
  const cv=$('#heroCanvas'), viz=$('#viz'); if(!cv) return;
  const ctx=cv.getContext('2d'); const R=rng(7);
  let W=0,H=0,col={};
  function readColors(){ col={ink:css('--ink-2'),lapis:css('--lapis'),faint:css('--faint')}; }
  function size(){ const r=cv.getBoundingClientRect(); const dpr=Math.min(window.devicePixelRatio||1,2); W=r.width; H=r.height; cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
  readColors(); size();
  const idx={}; VIZ.forEach((c,i)=>idx[c.key]=i);
  const parts=[];
  VIZ.forEach((c,ci)=>{ const cnt=Math.round(c.n/2.3); for(let i=0;i<cnt;i++) parts.push({c:ci,a:R()*Math.PI*2,rr:Math.pow(R(),.7)*c.rad,sp:(R()-.5)*.004,sx:R(),sy:R(),z:.9+R()*1.1}); });
  for(let i=0;i<40;i++) parts.push({c:-1,sx:R(),sy:R(),vx:(R()-.5)*.00012,vy:(R()-.5)*.00012,z:.8+R()});
  let hover=-1,raf=0; const t0=performance.now();
  function frame(now){
    const t=RM?1:Math.min(1,(now-t0)/2400), e=1-Math.pow(1-t,3);
    ctx.clearRect(0,0,W,H);
    VLINKS.forEach(([a,b,w])=>{ const A=VIZ[idx[a]],Bn=VIZ[idx[b]]; const on=hover===idx[a]||hover===idx[b];
      ctx.strokeStyle=on?col.lapis:col.ink; ctx.globalAlpha=(on?.7:.14)*e; ctx.lineWidth=.8+w/9;
      ctx.beginPath(); ctx.moveTo(A.x*W,A.y*H); ctx.lineTo(Bn.x*W,Bn.y*H); ctx.stroke(); });
    VIZ.forEach((c,i)=>{ const on=i===hover||c.hot; const x=c.x*W,y=c.y*H,r=c.rad+13;
      ctx.fillStyle=on?col.lapis:col.ink; ctx.globalAlpha=e*(on?.08:.035);
      ctx.beginPath(); ctx.ellipse(x,y,r,r*.84,0,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=e*(on?.55:.2); ctx.strokeStyle=on?col.lapis:col.ink; ctx.lineWidth=1; ctx.stroke();
      if(c.hot&&!RM){ const ph=((now-t0)%3200)/3200; ctx.globalAlpha=(1-ph)*.35*e; ctx.beginPath(); ctx.ellipse(x,y,r+ph*26,(r+ph*26)*.84,0,0,Math.PI*2); ctx.stroke(); }
    });
    parts.forEach(p=>{
      let x,y;
      if(p.c<0){ if(!RM){ p.sx=(p.sx+p.vx+1)%1; p.sy=(p.sy+p.vy+1)%1; } x=p.sx*W; y=p.sy*H; ctx.globalAlpha=.35; ctx.fillStyle=col.faint; }
      else { const c=VIZ[p.c]; if(!RM) p.a+=p.sp; const tx=c.x*W+Math.cos(p.a)*p.rr, ty=c.y*H+Math.sin(p.a)*p.rr*.82;
        x=p.sx*W+(tx-p.sx*W)*e; y=p.sy*H+(ty-p.sy*H)*e; const on=c.hot||p.c===hover;
        ctx.globalAlpha=on?.9:.55; ctx.fillStyle=on?col.lapis:col.ink; }
      ctx.beginPath(); ctx.arc(x,y,1.2*p.z,0,Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha=1;
    if(!RM) raf=requestAnimationFrame(frame);
  }
  raf=requestAnimationFrame(frame);
  const tip=$('#vizTip');
  function setHover(h){
    if(h===hover) return; hover=h; cv.style.cursor=h>=0?'pointer':'default';
    $$('.vl',viz).forEach(b=>b.classList.toggle('on',h>=0&&b.dataset.k===VIZ[h].key));
    if(h<0) tip.hidden=true;
    else {
      const c=VIZ[h], cl=CLUSTERS[c.key];
      const links=VLINKS.filter(l=>l[0]===c.key||l[1]===c.key).sort((a,b)=>b[2]-a[2]).slice(0,2).map(l=>{ const o=l[0]===c.key?l[1]:l[0]; return esc(L(CLUSTERS[o].name))+' '+pct(l[2]); }).join(LANG==='ar'?'، ':', ');
      tip.innerHTML=`<h4><span>${esc(L(cl.name))}</span><span class="up">↑ ${pct(cl.delta)}</span></h4><div class="muted" style="font-size:12px">${qn(cl.n)} · ${esc(L(cl.why))}</div><div class="tq">«${esc(L(cl.nodes[0].qs[0]))}»</div><div class="tl">${T('Overlaps with: ','يتقاطع مع: ')}${links}</div><div class="go">${T('Click to open the analysis','اضغط لفتح التحليل')}</div>`;
      tip.hidden=false;
      const vw=viz.clientWidth; const px=Math.max(135,Math.min(vw-135,c.x*vw));
      tip.style.left=px+'px'; tip.style.top=(c.y*H-c.rad*.84-8)+'px';
      tip.style.transform=(c.y*H-c.rad<170)?'translate(-50%,'+Math.round(c.rad*1.7+60)+'px)':'';
    }
    if(RM) frame(performance.now());
  }
  function pick(ev){ const r=cv.getBoundingClientRect(); const mx=ev.clientX-r.left,my=ev.clientY-r.top; let best=-1,bd=1e9; VIZ.forEach((c,i)=>{ const d=Math.hypot(mx-c.x*W,(my-c.y*H)/.84); if(d<c.rad+26&&d<bd){bd=d;best=i;} }); return best; }
  cv.addEventListener('mousemove',ev=>setHover(pick(ev)));
  cv.addEventListener('mouseleave',()=>setHover(-1));
  cv.addEventListener('click',ev=>{ const h=pick(ev); if(h>=0) go('cluster',VIZ[h].key); });
  $$('.vl',viz).forEach(b=>{ b.addEventListener('mouseenter',()=>setHover(idx[b.dataset.k])); b.addEventListener('mouseleave',()=>setHover(-1)); b.addEventListener('focus',()=>setHover(idx[b.dataset.k])); b.addEventListener('blur',()=>setHover(-1)); });
  const onResize=()=>{ size(); if(RM) frame(performance.now()); };
  window.addEventListener('resize',onResize);
  cleanups.push(()=>{ cancelAnimationFrame(raf); window.removeEventListener('resize',onResize); });
};

const CH={w:640,h:220,pl:34,pr:26,pt:22,pb:28,max:300};
const chX=i=>CH.pl+i*(CH.w-CH.pl-CH.pr)/(VOLUME.length-1), chY=v=>CH.pt+(1-v/CH.max)*(CH.h-CH.pt-CH.pb);
function areaChart(){
  const {w,h,pl,pr,pt,pb}=CH, li=VOLUME.length-1, step=(w-pl-pr)/(VOLUME.length-1);
  const d=VOLUME.map((v,i)=>(i?'L':'M')+chX(i).toFixed(1)+','+chY(v).toFixed(1)).join(' ');
  const ff=LANG==='ar'?'IBM Plex Sans Arabic, sans-serif':'IBM Plex Mono, monospace';
  const grid=[0,100,200,300].map(v=>`<line x1="${pl}" x2="${w-pr}" y1="${chY(v)}" y2="${chY(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-8}" y="${chY(v)+4}" text-anchor="end" font-family="${ff}" font-size="10.5" fill="var(--muted)">${N(v)}</text>`).join('');
  const labels=WEEKS.map((x,i)=>(i%3===0||i===li)?`<text x="${chX(i)}" y="${h-8}" text-anchor="${i===li?'end':'middle'}" font-family="${ff}" font-size="10.5" fill="var(--muted)">${wk(i)}</text>`:'').join('');
  const hits=VOLUME.map((v,i)=>`<rect class="hit" data-i="${i}" x="${chX(i)-step/2}" y="${pt}" width="${step}" height="${h-pt-pb}" fill="transparent"/>`).join('');
  return `<div dir="ltr"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${T('Weekly questions analyzed (simulated), rising from 190 to 298','الأسئلة المحللة أسبوعيًا (محاكاة)، ترتفع من ١٩٠ إلى ٢٩٨')}">${grid}
    <path d="${d} L${chX(li)},${chY(0)} L${chX(0)},${chY(0)} Z" fill="var(--lapis)" opacity=".1"/>
    <path d="${d}" fill="none" stroke="var(--lapis)" stroke-width="2" stroke-linejoin="round"/>
    <line id="chartCursor" x1="0" x2="0" y1="${pt}" y2="${h-pb}" stroke="var(--ink-2)" stroke-dasharray="2 3" opacity="0"/>
    <circle id="chartDot" r="4" fill="var(--surface)" stroke="var(--lapis)" stroke-width="2" cx="${chX(li)}" cy="${chY(VOLUME[li])}"/>
    <text x="${chX(li)-10}" y="${chY(VOLUME[li])+20}" text-anchor="end" font-family="${ff}" font-size="11.5" fill="var(--ink)">${N(298)}</text>

/* ---------- cluster ---------- */
const NODE_POS=[[178,126],[546,120],[556,346],[170,350]];
const CENTER=[362,236];
function clusterGraph(c){
  const sel=state.clusterSel[c.key]||c.nodes[0].id, R=rng(c.n*13), rad=n=>14+Math.sqrt(n)*2.7, dir=LANG==='ar'?'rtl':'ltr';
  let sats='',spokes='',nodes='',ovl='';
  c.overlaps.forEach(o=>{ const a=NODE_POS[o.a],b=NODE_POS[o.b]; const m=[(a[0]+b[0])/2,(a[1]+b[1])/2]; const cp=[m[0]+(m[0]-CENTER[0])*.55,m[1]+(m[1]-CENTER[1])*.55];
    const lx=.25*a[0]+.5*cp[0]+.25*b[0], ly=.25*a[1]+.5*cp[1]+.25*b[1];
    ovl+=`<path class="ovl" d="M${a[0]},${a[1]} Q${cp[0]},${cp[1]} ${b[0]},${b[1]}" stroke-width="${(1+o.v/14).toFixed(1)}"/><g class="ovl-lbl"><rect x="${lx-44}" y="${ly-11}" width="88" height="22" rx="11"/><text x="${lx}" y="${ly+4}" text-anchor="middle" direction="${dir}">${pct(o.v)} ${T('overlap','تداخل')}</text></g>`; });
  c.nodes.forEach((n,i)=>{ const [x,y]=NODE_POS[i], r=rad(n.n), on=n.id===sel;
    spokes+=`<line class="spoke ${on?'on':''}" data-n="${n.id}" x1="${CENTER[0]}" y1="${CENTER[1]}" x2="${x}" y2="${y}"/>`;
    const cnt=Math.max(6,Math.round(n.n/2.2));
    for(let k=0;k<cnt;k++){ const a=R()*Math.PI*2, d=r+8+Math.pow(R(),.8)*32; sats+=`<circle class="sat ${on?'on':''}" data-n="${n.id}" cx="${(x+Math.cos(a)*d).toFixed(1)}" cy="${(y+Math.sin(a)*d*.8).toFixed(1)}" r="${(1.4+R()*1.3).toFixed(1)}"/>`; }
    const ly=y>CENTER[1]?y+r+48:y-r-56;
    nodes+=`<g class="cnode ${on?'sel':''}" data-act="clusterNode" data-node="${n.id}" tabindex="0" role="button" aria-label="${esc(L(n.label))}">
      <circle class="halo" cx="${x}" cy="${y}" r="${r}"/><circle class="ring" cx="${x}" cy="${y}" r="${r}"/><circle class="core" cx="${x}" cy="${y}" r="${Math.max(4,r*.22)}"/>
      <text class="lbl" x="${x}" y="${ly}" text-anchor="middle" direction="${dir}">${esc(L(n.label))}</text>
      <text class="cnt" x="${x}" y="${ly+18}" text-anchor="middle" direction="${dir}">${qn(n.n)} · ${pct(Math.round(n.n/c.n*100))}</text></g>`; });
  const nm=L(c.name), fs=nm.length<=8?(LANG==='ar'?22:19):nm.length<=12?15:12.5;
  return `<svg viewBox="0 0 724 474" role="group" aria-label="${esc(nm)}">${spokes}${ovl}${sats}
    <g class="center-node"><circle class="ring2" cx="${CENTER[0]}" cy="${CENTER[1]}" r="62"/><circle class="c1" cx="${CENTER[0]}" cy="${CENTER[1]}" r="50"/><text x="${CENTER[0]}" y="${CENTER[1]+6}" text-anchor="middle" direction="${dir}" style="font-size:${fs}px">${esc(nm)}</text></g>${nodes}</svg>`;
}

function drawEdges(){
  const wrap=$('#emap'),svg=$('#edges'); if(!wrap||!svg) return;
  const rtl=document.documentElement.dir==='rtl';
  const W=wrap.offsetWidth,H=wrap.offsetHeight,box=wrap.getBoundingClientRect();
  svg.setAttribute('width',W); svg.setAttribute('height',H); svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  let out='';
  EDGES.forEach(ed=>{
    const A=$(`.mnode[data-id="${ed.a}"]`,wrap),Bn=$(`.mnode[data-id="${ed.b}"]`,wrap); if(!A||!Bn) return;
    const a=A.getBoundingClientRect(),b=Bn.getBoundingClientRect();
    const x1=(rtl?a.left:a.right)-box.left, y1=a.top+a.height/2-box.top, x2=(rtl?b.right:b.left)-box.left, y2=b.top+b.height/2-box.top;
    const dx=(x2-x1)*.55;
    const d=`M${x1.toFixed(1)},${y1.toFixed(1)} C${(x1+dx).toFixed(1)},${y1.toFixed(1)} ${(x2-dx).toFixed(1)},${y2.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}`;
    const k=ed.a+'>'+ed.b;
    out+=`<path class="edge ${ed.st?'st-'+ed.st:''} ${ed.b==='k'?'to-k':''}" data-e="${k}" d="${d}" pathLength="1" style="animation-delay:${(ed.col*.2+.15).toFixed(2)}s"/><path class="flow" data-e="${k}" d="${d}"/>`;
  });
  svg.innerHTML=out; applyHighlight();
}
function applyHighlight(){
  const wrap=$('#emap'); if(!wrap) return;
  const id=state.hover||state.selected;
  $$('.mnode',wrap).forEach(n=>n.classList.toggle('sel',n.dataset.id===state.selected));
  $$('.concept').forEach(n=>n.style.borderColor=(state.selected===n.dataset.id)?'var(--lapis)':'');
  if(!id){ wrap.classList.remove('focus'); $$('.mnode.on',wrap).forEach(n=>n.classList.remove('on')); $$('#edges path.on').forEach(p=>p.classList.remove('on')); return; }
  const Ln=lineage(id); wrap.classList.add('focus');
  $$('.mnode',wrap).forEach(n=>n.classList.toggle('on',Ln.nodes.has(n.dataset.id)));

MOUNT.analysis=function(){
  const wrap=$('#emap'); if(!wrap) return;
  $$('.lane',wrap).forEach(l=>{ const col=+l.dataset.col; $$('.mnode',l).forEach((n,i)=>n.style.animationDelay=(col*.16+i*.05)+'s'); });
  requestAnimationFrame(drawEdges);
  later(()=>{ const s=$('#edges'); if(s) s.classList.remove('draw'); wrap.classList.remove('intro'); drawEdges(); },2600);
  const ro=new ResizeObserver(()=>drawEdges()); ro.observe(wrap);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>drawEdges());
  wrap.addEventListener('mouseover',e=>{ const n=e.target.closest('.mnode'); const id=n?n.dataset.id:null; if(id!==state.hover){ state.hover=id; applyHighlight(); } });
  wrap.addEventListener('mouseleave',()=>{ state.hover=null; applyHighlight(); });
  wrap.addEventListener('click',e=>{ if(!e.target.closest('.mnode')&&state.selected){ state.selected=null; applyHighlight(); } });
  cleanups.push(()=>{ ro.disconnect(); state.hover=null; });
  if(state.pendingScroll){ const s=state.pendingScroll; state.pendingScroll=null; later(()=>scrollToEl(s),120); }
};
